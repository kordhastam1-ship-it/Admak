<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Apocalypse - بازی سه‌بعدی</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101820;font-family:Tahoma,Arial}#view{display:block;width:100%;height:100%;touch-action:none}#info{position:fixed;top:10px;left:10px;color:white;background:#0008;padding:8px 12px;border-radius:10px;font-size:13px;direction:rtl}#pad{position:fixed;bottom:18px;left:18px;display:grid;grid-template-columns:58px 58px 58px;grid-template-rows:58px 58px 58px;gap:5px;direction:ltr}button{border:1px solid #ffffff88;background:#172b38cc;color:white;border-radius:14px;font-size:25px;touch-action:none}button:active{background:#397d55}#up{grid-column:2}#left{grid-column:1;grid-row:2}#down{grid-column:2;grid-row:2}#right{grid-column:3;grid-row:2}#hint{position:fixed;bottom:12px;right:12px;color:#fff;background:#0007;padding:8px 10px;border-radius:9px;font-size:12px}
</style>
</head><body>
<canvas id="view"></canvas><div id="info">حرکت: دکمه‌ها یا کلیدهای جهت‌دار / WASD</div>
<div id="pad"><button id="up">▲</button><button id="left">◀</button><button id="down">▼</button><button id="right">▶</button></div><div id="hint">برای حرکت، دکمه‌ها را نگه دار</div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
import { GLTFLoader } from 'https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/loaders/GLTFLoader.js';
const canvas=document.querySelector('#view');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
const scene=new THREE.Scene();scene.background=new THREE.Color(0x9bc9e8);scene.fog=new THREE.Fog(0x9bc9e8,22,65);
const camera=new THREE.PerspectiveCamera(55,innerWidth/innerHeight,.1,150);
scene.add(new THREE.HemisphereLight(0xffffff,0x56734a,2));const sun=new THREE.DirectionalLight(0xffffff,2.2);sun.position.set(-6,12,7);sun.castShadow=true;scene.add(sun);
const ground=new THREE.Mesh(new THREE.PlaneGeometry(160,160),new THREE.MeshStandardMaterial({color:0x3f963e,roughness:1}));ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);
const grid=new THREE.GridHelper(160,80,0x2d702d,0x4c9a45);grid.position.y=.012;scene.add(grid);
// ساده‌سازی محیط: چند درخت دوردست
for(let i=0;i<28;i++){let a=i/28*Math.PI*2,r=17+(i%4)*3,x=Math.cos(a)*r,z=Math.sin(a)*r;let trunk=new THREE.Mesh(new THREE.CylinderGeometry(.12,.18,1.3,7),new THREE.MeshStandardMaterial({color:0x76502c}));trunk.position.set(x,.65,z);scene.add(trunk);let crown=new THREE.Mesh(new THREE.ConeGeometry(.85,2.2,7),new THREE.MeshStandardMaterial({color:0x17652b}));crown.position.set(x,2.2,z);scene.add(crown)}
const player=new THREE.Group();scene.add(player);let model=null,bones={};
new GLTFLoader().load('./Apocalypse.glb',g=>{model=g.scene;player.add(model);model.traverse(o=>{if(o.isMesh){o.castShadow=true;o.frustumCulled=false}});if(g.scene.getObjectByName('Hips')) bones.hips=g.scene.getObjectByName('Hips');for(const n of ['LeftUpLeg','RightUpLeg','LeftLeg','RightLeg','LeftFoot','RightFoot','LeftArm','RightArm','LeftForeArm','RightForeArm','Spine'])bones[n]=g.scene.getObjectByName(n);const box=new THREE.Box3().setFromObject(model);const size=box.getSize(new THREE.Vector3());const center=box.getCenter(new THREE.Vector3());model.position.x-=center.x;model.position.z-=center.z;model.position.y-=box.min.y;const h=size.y||2;model.scale.setScalar(2.1/h);},undefined,e=>{document.querySelector('#info').textContent='خطا در بارگذاری مدل؛ فایل GLB کنار index.html باشد.';console.error(e)});
const keys={};addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true});addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false});
const map={up:['arrowup','w'],down:['arrowdown','s'],left:['arrowleft','a'],right:['arrowright','d']};for(const [id,ks] of Object.entries(map)){const b=document.getElementById(id);b.addEventListener('pointerdown',e=>{e.preventDefault();ks.forEach(k=>keys[k]=true);b.setPointerCapture(e.pointerId)});const off=()=>ks.forEach(k=>keys[k]=false);b.addEventListener('pointerup',off);b.addEventListener('pointercancel',off);b.addEventListener('lostpointercapture',off)}
const clock=new THREE.Clock();let phase=0;const v=new THREE.Vector3();
function animate(){requestAnimationFrame(animate);const dt=Math.min(clock.getDelta(),.04);let x=(keys['arrowright']||keys['d']?1:0)-(keys['arrowleft']||keys['a']?1:0),z=(keys['arrowdown']||keys['s']?1:0)-(keys['arrowup']||keys['w']?1:0);let moving=x!==0||z!==0;if(moving){v.set(x,0,z).normalize();player.position.addScaledVector(v,dt*3.1);player.rotation.y=Math.atan2(v.x,v.z);phase+=dt*9}else phase=0;
const s=Math.sin(phase);if(bones.LeftUpLeg)bones.LeftUpLeg.rotation.x=moving?s*.48:0;if(bones.RightUpLeg)bones.RightUpLeg.rotation.x=moving?-s*.48:0;if(bones.LeftLeg)bones.LeftLeg.rotation.x=moving?Math.max(0,-s)*.65:0;if(bones.RightLeg)bones.RightLeg.rotation.x=moving?Math.max(0,s)*.65:0;if(bones.LeftArm)bones.LeftArm.rotation.x=moving?-s*.28:0;if(bones.RightArm)bones.RightArm.rotation.x=moving?s*.28:0;if(bones.LeftForeArm)bones.LeftForeArm.rotation.x=moving?-.15:0;if(bones.RightForeArm)bones.RightForeArm.rotation.x=moving?-.15:0;if(bones.hips)bones.hips.position.y=(bones.hips.userData.baseY??=bones.hips.position.y)+(moving?Math.abs(s)*.035:0);
const target=new THREE.Vector3(player.position.x,1.15,player.position.z);camera.position.lerp(new THREE.Vector3(player.position.x,4.2,player.position.z-7.5),.08);camera.lookAt(target);renderer.render(scene,camera)}animate();
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script></body></html>
